[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "mini-harness"
version = "0.3.0"
description = "用 Python 从零理解 DeepSeek Harness 的 Headless 架构"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "httpx>=0.28,<1",
  "httpx-sse>=0.4,<1",
  "python-dotenv>=1.1,<2",
]

[project.scripts]
mini-harness = "mini_harness.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["chapters/17-headless-capstone/src/mini_harness"]

[tool.hatch.build.targets.sdist]
exclude = [
  "/AGENTS.md",
  "/LOCAL_CONTEXT.md",
]
